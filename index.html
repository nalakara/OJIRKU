<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon_maskable.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D172E" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OJIRKU">
    <title>OJIRKU - Personal Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --background-start-rgb: #38345E;
        --background-end-rgb: #1D172E;
        --accent-orange: #F97316;
        --accent-yellow: #FACC15;
        --accent-teal: #14B8A6;
        --font-sans: 'Manrope', sans-serif;
      }
      body {
        background-color: var(--background-end-rgb);
        background-image: linear-gradient(160deg, var(--background-start-rgb) 0%, var(--background-end-rgb) 100%);
        font-family: var(--font-sans);
        color: #e5e7eb; /* Default text-gray-200 */
      }
      .prose {
        color: inherit;
      }
      .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
        color: inherit;
      }
      .prose strong {
        color: inherit;
      }
      .prose a {
        color: var(--accent-teal);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
